<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111111" />
    <title>Brew Guide</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iPadOS and iOS read this, not the manifest, for the Home Screen icon. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Runs before first paint so a saved theme never flashes the other one.
      // Mirrors applyTheme() in src/storage/theme.ts.
      try {
        var t = localStorage.getItem('brew-guide:theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
